<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Generator Teks Sulap ✨</title>
    <style>
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background-color: #1a1a2e;
            color: #fff;
            display: flex;
            flex-direction: column;
            align-items: center;
            padding: 30px;
        }
        h1 {
            color: #e94560;
            text-shadow: 2px 2px 4px rgba(0,0,0,0.5);
        }
        input {
            width: 80%;
            max-width: 400px;
            padding: 15px;
            font-size: 18px;
            border-radius: 8px;
            border: 2px solid #e94560;
            background-color: #16213e;
            color: white;
            margin-bottom: 30px;
            text-align: center;
        }
        .card {
            background-color: #0f3460;
            width: 80%;
            max-width: 500px;
            padding: 20px;
            border-radius: 10px;
            margin-bottom: 15px;
            box-shadow: 0 4px 8px rgba(0,0,0,0.3);
            text-align: center;
        }
        .card h3 {
            margin-top: 0;
            color: #f1b111;
            font-size: 16px;
        }
        .output {
            font-size: 22px;
            margin: 15px 0;
            word-break: break-all;
        }
        button {
            background-color: #e94560;
            color: white;
            border: none;
            padding: 10px 20px;
            border-radius: 5px;
            cursor: pointer;
            font-weight: bold;
        }
        button:hover {
            background-color: #d1304b;
        }
    </style>
</head>
<body>

    <h1>🪄 Teks Sulap Generator 🪄</h1>
    <p>Ketik kata atau namamu di bawah ini:</p>
    <input type="text" id="inputText" placeholder="Contoh: Pesulap Hebat" oninput="ubahTeks()">

    <!-- Tema 1 -->
    <div class="card">
        <h3>1. Tema Sulap Misterius (Gothic)</h3>
        <div class="output" id="out1">🔮✨ ... ✨🔮</div>
        <button onclick="salin('out1')">Copy</button>
    </div>

    <!-- Tema 2 -->
    <div class="card">
        <h3>2. Tema Sihir Berkilau (Elegan)</h3>
        <div class="output" id="out2">🌟🕊️ ... 🕊️🌟</div>
        <button onclick="salin('out2')">Copy</button>
    </div>

    <!-- Tema 3 -->
    <div class="card">
        <h3>3. Tema Ilusi (Glitch)</h3>
        <div class="output" id="out3">🎩🎭 ... 🎭🎩</div>
        <button onclick="salin('out3')">Copy</button>
    </div>

    <script>
        // Kamus Huruf Normal
        const normal = Array.from("abcdefghijklmnopqrstuvwxyzABCDEFGHIJKLMNOPQRSTUVWXYZ");
        
        // Kamus Huruf Sulap
        const gothic = Array.from("𝖆𝖇𝖈𝖉𝖊𝖋𝖌𝖍𝖎𝖏𝖐𝖑𝖒𝖓𝖔𝖕𝖖𝖗𝖘𝖙𝖚𝖛𝖜𝖝𝖞𝖟𝕬𝕭𝕮𝕯𝕰𝕱𝕲𝕳𝕴𝕵𝕶𝕷𝕸𝕹𝕺𝕻𝕼𝕽𝕾𝕿𝖀𝖁𝖂𝖃𝖄𝖅");
        const elegan = Array.from("𝒶𝒷𝒸𝒹𝑒𝒻𝑔𝒽𝒾𝒿𝓀𝓁𝓂𝓃𝑜𝓅𝓆𝓇𝓈𝓉𝓊𝓋𝓌𝓍𝓎𝓏𝒜ℬ𝒞𝒟ℰℱ𝒢ℋℐ𝒥𝒦ℒℳ𝒩𝒪𝒫𝒬ℛ𝒮𝒯𝒰𝒱𝒲𝒳𝒴𝒵");

        // Fungsi mengubah teks biasa menjadi gaya font khusus
        function konversiFont(teks, fontTujuan) {
            let hasil = "";
            for (let char of teks) {
                let index = normal.indexOf(char);
                if (index !== -1) {
                    hasil += fontTujuan[index]; // Ubah jika huruf terdeteksi
                } else {
                    hasil += char; // Biarkan jika spasi atau angka
                }
            }
            return hasil;
        }

        // Fungsi membuat teks ilusi coret (Glitch/Zalgo ringan)
        function buatGlitch(teks) {
            return Array.from(teks).map(huruf => huruf + '\u0337').join('');
        }

        // Fungsi utama yang dipanggil saat mengetik
        function ubahTeks() {
            let teksOri = document.getElementById("inputText").value;
            
            if (teksOri.trim() === "") {
                document.getElementById("out1").innerText = "🔮✨ ... ✨🔮";
                document.getElementById("out2").innerText = "🌟🕊️ ... 🕊️🌟";
                document.getElementById("out3").innerText = "🎩🎭 ... 🎭🎩";
                return;
            }

            // Memproses teks dengan font dan emoji
            let teksGothic = "🔮✨ " + konversiFont(teksOri, gothic) + " ✨🔮";
            let teksElegan = "🌟🕊️ " + konversiFont(teksOri, elegan) + " 🕊️🌟";
            let teksGlitch = "🎩🎭 " + buatGlitch(teksOri) + " 🎭🎩";

            // Menampilkan hasil
            document.getElementById("out1").innerText = teksGothic;
            document.getElementById("out2").innerText = teksElegan;
            document.getElementById("out3").innerText = teksGlitch;
        }

        // Fungsi untuk tombol Copy
        function salin(id) {
            let teks = document.getElementById(id).innerText;
            navigator.clipboard.writeText(teks).then(() => {
                alert("Berhasil disalin: " + teks);
            });
        }
    </script>
</body>
</html>
